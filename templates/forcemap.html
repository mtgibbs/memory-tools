<!doctype html>
<html><head><meta charset="utf-8"><title>memory atlas — force map</title>
<style>
html,body{margin:0;height:100%;background:#101014;overflow:hidden;font:12px -apple-system,system-ui,sans-serif}
#c{display:block;width:100vw;height:100vh;cursor:grab}
#tip{position:fixed;pointer-events:none;background:#1c1c22;color:#ddd;border:1px solid #333;
 padding:4px 8px;border-radius:4px;display:none;max-width:340px;z-index:2}
#legend{position:fixed;left:12px;bottom:12px;color:#999;background:rgba(16,16,20,.85);
 padding:8px 10px;border-radius:6px;line-height:1.7;z-index:1}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
#panels{position:fixed;right:12px;top:12px;z-index:1;display:flex;flex-direction:column;
 gap:8px;align-items:flex-end}
#panels details{color:#bbb;background:rgba(16,16,20,.9);padding:8px 12px;border-radius:6px;user-select:none}
#panels summary{cursor:pointer;color:#ddd;font-weight:600;margin-bottom:4px}
#panels label{display:flex;align-items:center;gap:8px;margin:5px 0;white-space:nowrap}
#panels label span:first-child{width:88px;color:#999}
#panels input[type=range]{width:140px;accent-color:#8aa8e0}
#panels input[type=checkbox]{accent-color:#8aa8e0}
#panels .val{width:44px;text-align:right;color:#ddd;font-variant-numeric:tabular-nums}
#panels button{margin-top:6px;background:#26262e;color:#ccc;border:1px solid #3a3a44;
 border-radius:4px;padding:3px 10px;cursor:pointer}
#panels button:hover{background:#32323c}
#panels select{background:#26262e;color:#ccc;border:1px solid #3a3a44;border-radius:4px;padding:2px 6px}
</style></head><body>
<canvas id="c"></canvas><div id="tip"></div>
<div id="legend">
 <span class="sw" style="background:#5a8cff"></span>personal realm field<br>
 <span class="sw" style="background:#ff5a50"></span>work realm field<br>
 <span class="sw" style="background:#ffd54a"></span>identity note (user / feedback)<br>
 <span class="sw" style="background:#b585f0"></span>boundary link (personal &#8646; work)<br>
 <span class="sw" style="background:#7a7a80"></span>expired / superseded<br>
 drag nodes &middot; drag background to pan &middot; scroll to zoom &middot; click opens in Obsidian
</div>
<div id="panels">
<details id="ctrl" open><summary>forces</summary></details>
<details id="disp" open><summary>display</summary></details>
</div>
<script>
"use strict";
const DATA = __DATA__;
document.title = DATA.vault + " — force map";
const N = DATA.nodes, E = DATA.edges;
const GOLD = "#ffd54a", ASH = "#7a7a80", PURPLE = "#b585f0";
const GA = 2.39996323; // golden angle

// ---- tunable forces -------------------------------------------------------
const DEFAULTS = { repel: 2200, field: 0.04, linkDist: 220, linkK: 1, corridor: 900,
                   nodeSize: 1, weight: 1, labels: "hover", realmLabels: true };
const P = { ...DEFAULTS };
try { Object.assign(P, JSON.parse(localStorage.getItem("forcemap-params") || "{}")); } catch (e) {}
const SLIDERS = [
  ["repel",    "repulsion",     0,   8000, 100,  v => v.toFixed(0)],
  ["field",    "field pull",    0,   0.15, 0.005, v => v.toFixed(3)],
  ["linkDist", "link distance", 50,  500,  10,   v => v.toFixed(0)],
  ["linkK",    "link strength", 0,   3,    0.05, v => v.toFixed(2)],
  ["corridor", "corridor",      0,   2200, 50,   v => v.toFixed(0)],
  ["nodeSize", "node size",     0.5, 2.5,  0.05, v => v.toFixed(2)],
  ["weight",   "hub weight",    0,   2,    0.05, v => v.toFixed(2)],
];

// connection counts drive size and mass; adjacency drives hover highlighting
N.forEach(n => { n.conn = 0; n.adj = new Set(); });
E.forEach(e => {
  N[e.s].conn++; N[e.t].conn++;
  N[e.s].adj.add(e.t); N[e.t].adj.add(e.s);
});

// ---- realm anchors: pack each side, keep the corridor empty ---------------
const realms = new Map();
N.forEach((n, i) => {
  n.i = i;
  if (!realms.has(n.realm))
    realms.set(n.realm, { name: n.realm, short: n.short, work: n.work, members: [] });
  realms.get(n.realm).members.push(n);
});
const R = [...realms.values()];
[false, true].forEach(work => {
  R.filter(r => r.work === work)
   .sort((a, b) => b.members.length - a.members.length)
   .forEach((r, j) => {
     r.rad = 30 + 16 * Math.sqrt(r.members.length);
     const rr = 130 * Math.sqrt(j), th = j * GA;
     r.x = (work ? 900 : -900) + rr * Math.cos(th);
     r.y = rr * Math.sin(th);
   });
});
for (let it = 0; it < 600; it++) {
  for (const a of R) { a.fx = ((a.work ? 900 : -900) - a.x) * 0.02; a.fy = -a.y * 0.02; }
  for (let i = 0; i < R.length; i++) for (let j = i + 1; j < R.length; j++) {
    const a = R[i], b = R[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const want = a.rad + b.rad + 90;
    if (d < want) { const f = (want - d) / d * 0.25; a.fx -= dx * f; a.fy -= dy * f; b.fx += dx * f; b.fy += dy * f; }
  }
  for (const a of R) { a.x += a.fx; a.y += a.fy; }
}
// remember each anchor's position relative to its side, so the corridor slider
// can move the sides without redoing the packing
for (const r of R) { r.side = r.work ? 1 : -1; r.relx = r.x - r.side * 900; }
function relayout() { for (const r of R) r.x = r.side * P.corridor + r.relx; }
relayout();
R.forEach(r => r.members.forEach((n, j) => {
  const rr = 13 * Math.sqrt(j), th = j * GA;
  n.x = r.x + rr * Math.cos(th); n.y = r.y + rr * Math.sin(th);
  n.vx = 0; n.vy = 0; n.anchor = r;
  n.r = 3 + Math.min(9, Math.sqrt(n.conn) * 1.7);
}));

// ---- simulation -----------------------------------------------------------
let alpha = 1;
function stepSim() {
  alpha *= 0.996;
  for (const n of N) {
    n.fx = 0; n.fy = 0;
    n.m = 1 + P.weight * Math.sqrt(n.conn);   // hubs are heavy: push harder, drift less
  }
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
    const a = N[i], b = N[j];
    let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
    if (d2 > 90000) continue;                 // 300px cutoff: repulsion stays local
    d2 = Math.max(d2, 25);
    const d = Math.sqrt(d2), f = P.repel / d2 * (a.m + b.m) / 2;
    dx /= d; dy /= d;
    a.fx -= dx * f; a.fy -= dy * f; b.fx += dx * f; b.fy += dy * f;
  }
  for (const e of E) {
    const a = N[e.s], b = N[e.t];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
    const rest = e.i ? P.linkDist * 0.32 : (e.b ? P.corridor * 0.55 + 100 : P.linkDist);
    const k = (e.i ? 0.04 : (e.b ? 0.002 : 0.01)) * P.linkK; // boundary springs stay weak: the gap must hold
    const f = (d - rest) * k;
    a.fx += dx / d * f; a.fy += dy / d * f; b.fx -= dx / d * f; b.fy -= dy / d * f;
  }
  for (const n of N) {
    n.fx += (n.anchor.x - n.x) * P.field;     // the forcefield: home pull per realm
    n.fy += (n.anchor.y - n.y) * P.field;
    if (n === dragNode) continue;
    n.vx = (n.vx + n.fx / n.m * alpha) * 0.8;
    n.vy = (n.vy + n.fy / n.m * alpha) * 0.8;
    n.x += n.vx; n.y += n.vy;
  }
}

// ---- view -----------------------------------------------------------------
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const tip = document.getElementById("tip");
let scale = 1, tx = 0, ty = 0, dpr = 1;
function fit() {
  dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const r of R) {
    x0 = Math.min(x0, r.x - r.rad); y0 = Math.min(y0, r.y - r.rad);
    x1 = Math.max(x1, r.x + r.rad); y1 = Math.max(y1, r.y + r.rad);
  }
  scale = Math.min(innerWidth / (x1 - x0 + 200), innerHeight / (y1 - y0 + 200));
  tx = innerWidth / 2 - (x0 + x1) / 2 * scale;
  ty = innerHeight / 2 - (y0 + y1) / 2 * scale;
}
fit(); addEventListener("resize", () => { fit(); });

function draw() {
  if (alpha > 0.003) stepSim();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * tx, dpr * ty);

  for (const r of R) {                        // fields
    let cx = 0, cy = 0;
    for (const n of r.members) { cx += n.x; cy += n.y; }
    cx /= r.members.length; cy /= r.members.length;
    let s = 0;
    for (const n of r.members) s = Math.max(s, Math.hypot(n.x - cx, n.y - cy));
    const rad = s + 40, col = r.work ? "255,90,80" : "90,140,255";
    const g = ctx.createRadialGradient(cx, cy, rad * 0.2, cx, cy, rad);
    g.addColorStop(0, "rgba(" + col + ",0.10)"); g.addColorStop(1, "rgba(" + col + ",0.015)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(" + col + ",0.28)"; ctx.lineWidth = 1 / scale;
    ctx.setLineDash([4 / scale, 6 / scale]); ctx.stroke(); ctx.setLineDash([]);
    if (P.realmLabels) {
      ctx.fillStyle = "rgba(" + col + ",0.85)";
      ctx.font = "600 " + (13 / scale) + "px system-ui"; ctx.textAlign = "center";
      ctx.fillText(r.short, cx, cy - rad - 8 / scale);
    }
    r.cx = cx; r.cy = cy;
  }
  const hi = hoverNode ? hoverNode.i : -1;    // ordinary edges under, boundary on top
  for (const e of E) {
    if (e.b) continue;
    const a = N[e.s], b = N[e.t];
    const hot = e.s === hi || e.t === hi;
    ctx.strokeStyle = hot ? "rgba(240,240,250,0.75)"
                          : e.i ? "rgba(200,200,210,0.08)" : "rgba(200,200,210,0.25)";
    ctx.lineWidth = (hot ? 1.8 : 1) / scale;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.strokeStyle = PURPLE;
  for (const e of E) {
    if (!e.b) continue;
    const a = N[e.s], b = N[e.t];
    const hot = e.s === hi || e.t === hi;
    ctx.globalAlpha = hot ? 1 : 0.85;
    ctx.lineWidth = (hot ? 3 : 2) / scale;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const n of N) {                        // nodes
    ctx.fillStyle = n.dead ? ASH : n.gold ? GOLD : (n.work ? "#e08a84" : "#8aa8e0");
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r * P.nodeSize, 0, 7); ctx.fill();
  }
  ctx.fillStyle = "rgba(220,220,225,0.75)";   // labels: per the labels switch
  ctx.font = (11 / scale) + "px system-ui"; ctx.textAlign = "center";
  for (const n of N) {
    const isHover = hoverNode && (n === hoverNode || hoverNode.adj.has(n.i));
    if (P.labels === "all" || isHover || (P.labels === "hubs" && n.conn >= 10))
      ctx.fillText(n.stem, n.x, n.y + n.r * P.nodeSize + 12 / scale);
  }
  requestAnimationFrame(draw);
}

// ---- interaction ----------------------------------------------------------
let dragNode = null, panning = false, moved = 0, px = 0, py = 0, hoverNode = null;
const world = ev => [(ev.clientX - tx) / scale, (ev.clientY - ty) / scale];
function pick(ev) {
  const [wx, wy] = world(ev);
  let best = null, bd = 1e9;
  for (const n of N) {
    const d = Math.hypot(n.x - wx, n.y - wy);
    if (d < Math.max(n.r * P.nodeSize + 4 / scale, 9 / scale) && d < bd) { best = n; bd = d; }
  }
  return best;
}
cv.addEventListener("pointerdown", ev => {
  cv.setPointerCapture(ev.pointerId);
  moved = 0; px = ev.clientX; py = ev.clientY;
  dragNode = pick(ev);
  panning = !dragNode;
});
cv.addEventListener("pointermove", ev => {
  moved += Math.abs(ev.clientX - px) + Math.abs(ev.clientY - py);
  if (dragNode) {
    const [wx, wy] = world(ev);
    dragNode.x = wx; dragNode.y = wy; dragNode.vx = 0; dragNode.vy = 0;
    alpha = Math.max(alpha, 0.25);
  } else if (panning) { tx += ev.clientX - px; ty += ev.clientY - py; }
  px = ev.clientX; py = ev.clientY;
  hoverNode = (dragNode || panning) ? hoverNode : pick(ev);
  if (hoverNode && !panning) {
    tip.style.display = "block";
    tip.style.left = (ev.clientX + 14) + "px"; tip.style.top = (ev.clientY + 14) + "px";
    tip.textContent = hoverNode.stem + "  [" + hoverNode.short + "]  " +
      hoverNode.conn + " links (" + (hoverNode.deg || 0) + " inbound)" +
      (hoverNode.gold ? " · identity" : "") + (hoverNode.dead ? " · EXPIRED" : "");
  } else tip.style.display = "none";
});
cv.addEventListener("pointerup", ev => {
  if (moved < 5) {
    const n = pick(ev);
    if (n) location.href = "obsidian://open?vault=" + encodeURIComponent(DATA.vault) +
      "&file=" + encodeURIComponent(n.realm + "/memory/" + n.stem);
  }
  dragNode = null; panning = false;
});
cv.addEventListener("wheel", ev => {
  ev.preventDefault();
  const f = Math.exp(-ev.deltaY * 0.0015);
  const [wx, wy] = world(ev);
  scale *= f;
  tx = ev.clientX - wx * scale; ty = ev.clientY - wy * scale;
}, { passive: false });

// ---- slider panel ---------------------------------------------------------
const ctrl = document.getElementById("ctrl");
function saveParams() {
  try { localStorage.setItem("forcemap-params", JSON.stringify(P)); } catch (e) {}
}
const refs = {};
for (const [key, name, min, max, step, fmt] of SLIDERS) {
  const lab = document.createElement("label");
  lab.innerHTML = "<span>" + name + "</span><input type=range min=" + min +
    " max=" + max + " step=" + step + "><span class=val></span>";
  const inp = lab.querySelector("input"), val = lab.querySelector(".val");
  refs[key] = { inp, val, fmt };
  inp.value = P[key]; val.textContent = fmt(P[key]);
  inp.addEventListener("input", () => {
    P[key] = +inp.value; val.textContent = fmt(P[key]);
    if (key === "corridor") relayout();
    alpha = Math.max(alpha, 0.5); saveParams();
  });
  ctrl.appendChild(lab);
}
const disp = document.getElementById("disp");
const rlLab = document.createElement("label");
rlLab.innerHTML = "<span>realm labels</span><input type=checkbox>";
const rlBox = rlLab.querySelector("input");
rlBox.checked = P.realmLabels;
rlBox.addEventListener("change", () => { P.realmLabels = rlBox.checked; saveParams(); });
disp.appendChild(rlLab);
const labLab = document.createElement("label");
labLab.innerHTML = "<span>note labels</span><select>" +
  ["hover", "hubs", "all"].map(m => "<option value=" + m + ">" + m + "</option>").join("") +
  "</select>";
const labSel = labLab.querySelector("select");
labSel.value = P.labels;
labSel.addEventListener("change", () => { P.labels = labSel.value; saveParams(); });
disp.appendChild(labLab);
const rb = document.createElement("button");
rb.textContent = "reset";
rb.addEventListener("click", () => {
  Object.assign(P, DEFAULTS); relayout(); saveParams();
  for (const [key] of SLIDERS) {
    refs[key].inp.value = P[key];
    refs[key].val.textContent = refs[key].fmt(P[key]);
  }
  labSel.value = P.labels;
  rlBox.checked = P.realmLabels;
  alpha = Math.max(alpha, 0.5);
});
ctrl.appendChild(rb);

requestAnimationFrame(draw);
</script></body></html>
